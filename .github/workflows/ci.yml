name: CI

on:
  pull_request:
  workflow_dispatch:
  # Called by "Build and deploy" so nothing reaches production untested.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, tests and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dispatch_owner
          POSTGRES_PASSWORD: dispatch_test_only
          POSTGRES_DB: dispatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dispatch_owner -d dispatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://dispatch_owner:dispatch_test_only@127.0.0.1:5432/dispatch_test?schema=public
      DISPATCH_TEST_DATABASE: '1'
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Compile all applications
        run: docker build --target migrate -t dispatch-check .
      - name: Apply migrations to disposable PostgreSQL
        run: docker run --rm --network host -e DATABASE_URL dispatch-check npm run db:migrate
      - name: Apply production database privilege policy to test roles
        run: |
          docker run --rm --network host -v "$PWD:/work:ro" \
            -e PGHOST=127.0.0.1 -e PGDATABASE=dispatch_test -e PGUSER=dispatch_owner \
            --entrypoint sh postgres:17-alpine -c '
              umask 077
              printf %s dispatch_test_only > /tmp/owner
              printf %s dispatch_api_test > /tmp/api
              printf %s dispatch_bot_test > /tmp/bot
              export POSTGRES_ADMIN_PASSWORD_FILE=/tmp/owner API_DB_PASSWORD_FILE=/tmp/api BOT_DB_PASSWORD_FILE=/tmp/bot
              sh /work/deploy/runtime/harden-users.sh
            '
      - name: Test reservations, menu routing, retention and database permissions
        run: |
          docker run --rm --network host \
            -e DATABASE_URL -e DISPATCH_TEST_DATABASE -e DATA_ENCRYPTION_KEY \
            dispatch-check node --import tsx --test --test-concurrency=1 tests/ticket-protections.test.ts

  validate:
    name: Compose and container images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          find ops security deploy/runtime -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n
          sh -n ops/dispatch-deploy
          sh -n ops/dispatch-deploy-entrypoint

      - name: Validate production Compose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/secrets
          for name in discord_token discord_client_secret session_secret data_encryption_key bot_internal_api_key postgres_admin_password api_db_password bot_db_password redis_password; do
            : > "deploy/secrets/$name"
          done
          DISPATCH_APP_IMAGE=ghcr.io/haxurus/dispatch@sha256:$(printf 'a%.0s' {1..64})           DISPATCH_MIGRATE_IMAGE=ghcr.io/haxurus/dispatch@sha256:$(printf 'b%.0s' {1..64})           docker compose --env-file deploy/.env.production.example -f deploy/docker-compose.prod.yml config -q

      - name: Build runtime image
        run: docker build --pull --target runtime -t dispatch-ci-runtime:${GITHUB_SHA} .

      - name: Build migration image
        run: docker build --target migrate -t dispatch-ci-migrate:${GITHUB_SHA} .
