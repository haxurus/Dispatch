name: Verify ticket implementation

on:
  push:
    branches: [work/ticket-protection-validation]

permissions:
  contents: write

jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'build: verify ticket protections')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dispatch_owner
          POSTGRES_PASSWORD: dispatch_test_only
          POSTGRES_DB: dispatch_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dispatch_owner -d dispatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://dispatch_owner:dispatch_test_only@127.0.0.1:5432/dispatch_test?schema=public
      DISPATCH_TEST_DATABASE: '1'
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Integrate reviewed changes against exact source hashes
        run: |
          python3 ops/prepare-ticket-protections.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/bot/src/tickets.ts')
          s = p.read_text().replace(
              'let channel: Awaited<ReturnType<typeof interaction.guild.channels.create>> | undefined;',
              'let channel: import("discord.js").TextChannel | undefined;')
          p.write_text(s)
          PY
      - name: Compile bot API web and Prisma
        run: docker build --target migrate -t dispatch-check .
      - name: Apply migrations to disposable PostgreSQL
        run: docker run --rm --network host -e DATABASE_URL dispatch-check npm run db:migrate
      - name: Apply production database privilege policy to test roles
        run: |
          docker run --rm --network host -v "$PWD:/work:ro" \
            -e PGHOST=127.0.0.1 -e PGDATABASE=dispatch_test -e PGUSER=dispatch_owner \
            --entrypoint sh postgres:17-alpine -c '
              umask 077
              printf %s dispatch_test_only > /tmp/owner
              printf %s dispatch_api_test > /tmp/api
              printf %s dispatch_bot_test > /tmp/bot
              export POSTGRES_ADMIN_PASSWORD_FILE=/tmp/owner API_DB_PASSWORD_FILE=/tmp/api BOT_DB_PASSWORD_FILE=/tmp/bot
              sh /work/deploy/runtime/harden-users.sh
            '
      - name: Test reservations menu retention and privileges
        run: |
          docker run --rm --network host \
            -e DATABASE_URL -e DISPATCH_TEST_DATABASE -e DATA_ENCRYPTION_KEY \
            dispatch-check node --import tsx --test --test-concurrency=1 tests/ticket-protections.test.ts
      - name: Commit only tested application changes to the isolated work branch
        run: |
          set -eu
          git add apps packages deploy docs tests
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'fix: enforce tested ticket opening and retention invariants'
          git push origin HEAD:work/ticket-protection-validation
